<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Virtualized image gallery</title>
<style>
  body { margin: 0; height: 3600px; background: white }
  button { margin: 16px }
  .tile { position: absolute; left: 40px; width: 100px; height: 100px; background: #cccccc }
  .tile img { display: block; width: 100%; height: 100% }
  #middle { top: 1120px }
  #last { top: 3100px }
</style>
<button id="top">Gallery</button>
<div id="middle" class="tile"></div>
<div id="last" class="tile"></div>
<script>
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const tile = entry.target;
      clearTimeout(tile.timer);
      tile.replaceChildren();
      tile.setAttribute('aria-busy', String(entry.isIntersecting));
      if (entry.isIntersecting) {
        tile.timer = setTimeout(() => {
          const image = new Image();
          image.alt = 'Gallery tile';
          image.onload = () => tile.setAttribute('aria-busy', 'false');
          image.src = '/gallery-tile.svg';
          tile.append(image);
        }, 400);
      }
    }
  });
  document.querySelectorAll('.tile').forEach(tile => observer.observe(tile));
</script>
</html>
